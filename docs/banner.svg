<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="summary-doctor banner — Citations, not verdicts.">
  <title>summary-doctor — Citations, not verdicts.</title>
  <desc>A horizontal banner showing the summary-doctor pipeline: summary + source flow into the tool, which emits four citation labels (exact, softened, reversed, fabricated).</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0f172a"/>
      <stop offset="1"   stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1"   stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .title    { font: 700 44px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
      .tagline  { font: 500 22px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #cbd5e1; }
      .mono     { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e2e8f0; }
      .mono-dim { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; }
      .lbl-exact      { fill: #22c55e; }
      .lbl-softened   { fill: #eab308; }
      .lbl-reversed   { fill: #f97316; }
      .lbl-fabricated { fill: #ef4444; }
      .box      { fill: #0b1220; stroke: #334155; stroke-width: 1.5; }
      .box-tool { fill: #1e293b; stroke: url(#accent); stroke-width: 2; }
      .arrow    { stroke: #64748b; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- left: title + tagline -->
  <g transform="translate(48,90)">
    <text class="title">summary-doctor</text>
    <text class="tagline" y="42">Citations, not verdicts.</text>
    <text class="mono-dim" y="78">audit AI summaries against their source &#183; offline-first &#183; mock &amp; LLM backends</text>
  </g>

  <!-- right: pipeline diagram -->
  <g transform="translate(560,70)" font-family="ui-monospace, monospace">

    <!-- inputs -->
    <g>
      <rect class="box" x="0"  y="20" width="130" height="44" rx="6"/>
      <text class="mono" x="65" y="48" text-anchor="middle">summary.txt</text>

      <rect class="box" x="0"  y="96" width="130" height="44" rx="6"/>
      <text class="mono" x="65" y="124" text-anchor="middle">source.txt</text>
    </g>

    <!-- arrows in -->
    <path class="arrow" d="M130,42  L210,80" marker-end="url(#arr)"/>
    <path class="arrow" d="M130,118 L210,80" marker-end="url(#arr)"/>

    <!-- tool box -->
    <g>
      <rect class="box-tool" x="210" y="50" width="160" height="60" rx="10"/>
      <text class="mono"      x="290" y="78"  text-anchor="middle">summary-doctor</text>
      <text class="mono-dim"  x="290" y="98"  text-anchor="middle">decompose &#183; map &#183; classify</text>
    </g>

    <!-- arrow out -->
    <path class="arrow" d="M370,80 L430,80" marker-end="url(#arr)"/>

    <!-- labels -->
    <g transform="translate(440,28)">
      <rect class="box" x="0" y="0"   width="170" height="28" rx="6"/>
      <text class="mono lbl-exact"      x="14" y="19">&#9679; exact</text>
      <text class="mono-dim"            x="160" y="19" text-anchor="end">claim &#8801; source</text>

      <rect class="box" x="0" y="36"  width="170" height="28" rx="6"/>
      <text class="mono lbl-softened"   x="14" y="55">&#9679; softened</text>
      <text class="mono-dim"            x="160" y="55" text-anchor="end">hedged</text>

      <rect class="box" x="0" y="72"  width="170" height="28" rx="6"/>
      <text class="mono lbl-reversed"   x="14" y="91">&#9679; reversed</text>
      <text class="mono-dim"            x="160" y="91" text-anchor="end">flipped</text>

      <rect class="box" x="0" y="108" width="170" height="28" rx="6"/>
      <text class="mono lbl-fabricated" x="14" y="127">&#9679; fabricated</text>
      <text class="mono-dim"            x="160" y="127" text-anchor="end">no source</text>
    </g>
  </g>

  <!-- footer hairline -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#accent)" opacity="0.6"/>
</svg>
